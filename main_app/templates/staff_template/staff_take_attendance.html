{% extends 'main_app/base.html' %}
{% load static %}
{% block page_title %}{{page_title}}{% endblock page_title %}
{% block content %}

<section class="content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <!-- general form elements -->
                <div class="card card-primary">
                    <div class="card-header">
                        <h3 class="card-title">{{page_title}}</h3>
                    </div>

                    <!-- /.card-header -->
                    <!-- form start -->
                    <div class="card-body">



                        <div class="form-group">
                            <label>Class</label>
                            <select name="course" class="form-control" id='course'>
                                <option value="">----</option>
                                {% for course in courses %}
                                <option value="{{course.id}}">{{course.name}}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Subject</label>
                            <select name="subject" class="form-control" id='subject' disabled>
                                <option value="">Select a class first</option>
                            </select>
                            <select id='all-subjects' style="display:none;">
                                {% for subject in subjects %}
                                <option value="{{subject.id}}" data-course="{{subject.course_id}}">{{subject.name}}</option>
                                {% endfor %}
                            </select>
                        </div>


                        <div class="form-group">
                            <label>Session Year</label>
                            <select name="session" id='session' class="form-control" disabled>
                                <option value="">Select a class first</option>
                            </select>
                            <select id='all-sessions' style="display:none;">
                                {% for session in sessions %}
                                <option value="{{session.id}}" data-courses="{{session.course_ids_str}}">{{session}}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Attendance Date</label>
                            <input type="date" class='form-control' name="attendance_date" id='attendance_date'>
                        </div>

                    </div>
                    <!-- /.card-body -->

                    <div class="card-footer">
                        <button type="button" id='fetch_student' class="btn btn-primary btn-block">Fetch
                            Students</button>
                        <div class="form-group" id="student_data">

                        </div>
                    </div>
                </div>
                <!-- /.card -->

            </div>
        </div>
    </div>
</section>
{% endblock content %}


{% block custom_js %}
<script>
    $(document).ready(function () {

        $("#course").change(function () {
            var course = $(this).val()
            var subjectSelect = $("#subject")
            var sessionSelect = $("#session")
            if (course.length == 0) {
                subjectSelect.html('<option value="">Select a class first</option>')
                subjectSelect.prop("disabled", true)
                sessionSelect.html('<option value="">Select a class first</option>')
                sessionSelect.prop("disabled", true)
                return
            }
            subjectSelect.html('<option value="">----</option>')
            $("#all-subjects option[data-course='" + course + "']").each(function () {
                subjectSelect.append($("<option>").val($(this).val()).text($(this).text()))
            })
            subjectSelect.prop("disabled", false)

            sessionSelect.html('<option value="">----</option>')
            $("#all-sessions option").each(function () {
                var courseIds = ($(this).data("courses") + "").split(" ")
                if (courseIds.indexOf(course) !== -1) {
                    sessionSelect.append($("<option>").val($(this).val()).text($(this).text()))
                }
            })
            sessionSelect.prop("disabled", false)
        })

        $("#fetch_student").click(function () {
            var course = $("#course").val()
            var subject = $("#subject").val()
            var session = $("#session").val()
            var attendance_date = $("#attendance_date").val()
            $("#student_data").html(null)
if (course.length == 0 || subject.length == 0 || session.length == 0 || attendance_date.length == 0){
    alert("Please select class, subject, session and date");
    return false;
}
            $.ajax({
                url: "{% url 'get_students' %}",
                type: 'POST',
                data: {
                    subject: subject,
                    session: session,
                    date: attendance_date
                }
            }).done(function (response) {
                var json_data = JSON.parse(response)
                if (json_data.length < 1) {
                    alert("No data to display")
                } else {
                    var div_data = "<hr/><div class='row'>"

                    for (key in json_data) {
                        var on_leave = json_data[key]['on_leave']
                        var checked_attr = on_leave ? "" : "checked='checked'"
                        var disabled_attr = on_leave ? "disabled='disabled'" : ""
                        var leave_badge = on_leave ? " <span class='badge badge-warning'>On Leave</span>" : ""
                        div_data += "<div class='col-lg-3'><div class='form-check custom-control custom-checkbox'><input type='checkbox' class='custom-control-input' " + checked_attr + " " + disabled_attr + " name='student_data[]' value=" + json_data[key]['id'] + " id='checkbox" + json_data[key]['id'] + "' /> <label for='checkbox" + json_data[key]['id'] + "' class='custom-control-label'>" + json_data[key]['name'] + leave_badge + "</label></div> </div>"
                    }
                    div_data += "</div>"
                    div_data += "<div class='form-group'><button id='save_attendance' class='btn btn-success' type='button'>Save Attendance</button></div>"
                    $("#student_data").html(div_data)
                }
            }).fail(function (response) {
                alert("Error in fetching students")
            })


            $(document).on('click', '#save_attendance', function () {
                $(this).attr("disabled","disabled")
                $(this).text("Saving Attendance Data...")
                var student_data = $("input[name='student_data[]']:not(:disabled)").map(function () {
                    if ($(this).is(":checked")){
                    return {'id':$(this).val(), 'status': 1};

                    }
                    return {'id':$(this).val(), 'status': 0};

                }).get()
                var attendance_date = $('#attendance_date').val()
                if (attendance_date.length < 10){
                    alert("Select date")
                    return false;
                }
                student_data = JSON.stringify(student_data)
                $.ajax({
                    url: "{% url 'save_attendance' %}",
                    type: 'POST',
                    data: {
                        date: attendance_date,
                        student_ids: student_data,
                        subject: subject,
                        session: session
            
                    }
                }).done(function (response) {
                    if (response == 'OK'){
                        alert("Saved")
                    }else{
                        alert("Error. Please try again")
                    }
                    location.reload()
                    
                }).fail(function (response) {
                    alert("Error in saving attendance")
                })
    
            })


        })
    })
</script>
{% endblock custom_js %}
